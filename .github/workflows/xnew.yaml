name: xnew

on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: "pkg name"
        required: true
        default: "defaultpkgname"

jobs:
  generate:
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest

    steps:
      - name: Install libstdc++ (required for Node.js actions)
        run: xbps-install -Syu libstdc++

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xtools
        run: xbps-install -Syu xtools

      - name: xnew
        run: |
          xnew ${{ inputs.pkgname }}
          echo "---"
          cat srcpkgs/${{ inputs.pkgname }}/template

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: template
          path: srcpkgs/${{ inputs.pkgname }}/   
