name: xnew

on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: "pkg name"
        required: true
        default: "defaultpkg"

jobs:
  generate:
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    env:
      SSL_NO_VERIFY_PEER: "1"

    steps:
      - name: Fix mirror
        run: |
          rm -f /etc/xbps.d/*
          echo "https://repo.voidlinux.org" > /etc/xbps.d/00-repo-main.conf
          echo "https://repo.voidlinux.org/current/multilib" > /etc/xbps.d/00-repo-multilib.conf

      - name: Install deps
        run: xbps-install -Syu ca-certificates libstdc++

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xtools
        run: xbps-install -Syu xtools

      - name: xnew
        run: |
          xnew ${{ inputs.pkgname }}
          echo "---"
          cat srcpkgs/${{ inputs.pkgname }}/template

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: template
          path: srcpkgs/${{ inputs.pkgname }}/
