name: xnew

on:
  workflow_dispatch:
    inputs:
      pkgname:
        description: "pkg name"
        required: true
        default: "defaultpkg"

jobs:
  generate:
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    env:
      SSL_NO_VERIFY_PEER: "1"

    steps:
      - name: Fix mirror
        run: |
          for f in /usr/share/xbps.d/*.conf; do
            sed -i 's|https://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
            sed -i 's|http://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
          done
          cat /usr/share/xbps.d/*.conf

      - name: Install deps
        run: |
          xbps-install -Syu xbps
          xbps-install -Syu ca-certificates libstdc++

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xtools
        run: xbps-install -Syu xtools

      - name: xnew
        run: |
          useradd -m -s /bin/sh builder
          chmod -R 777 "$GITHUB_WORKSPACE"
          rm -rf "$GITHUB_WORKSPACE/srcpkgs/${{ inputs.pkgname }}"
          su -s /bin/sh builder -c "export HOME=/github/home EDITOR=true && cd $GITHUB_WORKSPACE && xnew ${{ inputs.pkgname }}"
          echo "---"
          cat "$GITHUB_WORKSPACE/srcpkgs/${{ inputs.pkgname }}/template"

      - name: Upload template
        uses: actions/upload-artifact@v4
        with:
          name: template
          path: srcpkgs/${{ inputs.pkgname }}/
