name: build-package

on:
  workflow_dispatch:
    inputs:
      template_path:
        description: "template path"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: voidlinux/voidlinux:latest
      options: --user root

    steps:
      - name: Fix mirror
        shell: sh
        run: |
          set -eux
          for f in /usr/share/xbps.d/*.conf; do
            sed -i 's|https://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
            sed -i 's|http://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
          done
          echo "=== xbps mirrors ==="
          cat /usr/share/xbps.d/*.conf

      - name: Install Node dependencies in container
        shell: sh
        run: |
          set -eux
          xbps-install -Syu -R https://repo-fastly.voidlinux.org/current xbps
          xbps-install -Syu -R https://repo-fastly.voidlinux.org/current ca-certificates libstdc++ glibc git bash base-devel
          ldconfig
          ln -sf /usr/bin/bash /bin/sh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ethereal mode
        shell: sh
        run: |
          set -eux
          printf "%s\n" \
            "XBPS_CHROOT_CMD=ethereal" \
            "XBPS_ALLOW_CHROOT_BREAKOUT=yes" \
            > etc/conf
          rm -rf masterdir
          ln -s / masterdir

      - name: Bootstrap
        shell: bash
        run: |
          set -eux
          export HOME=/root
          cd "$GITHUB_WORKSPACE"
          ./xbps-src binary-bootstrap

      - name: Build
        shell: bash
        run: |
          set -eux
          export HOME=/root
          cd "$GITHUB_WORKSPACE"
          ./xbps-src -A x86_64 pkg "$(basename ${{ inputs.template_path }})"

      - name: Locate built packages
        shell: bash
        run: |
          set -eux
          echo "=== cercando i .xbps generati ==="
          find / -xdev -name "*.xbps" -path "*binpkgs*" 2>/dev/null | tee /tmp/found_pkgs.txt
          mkdir -p "$GITHUB_WORKSPACE/out"
          while read -r f; do
            cp "$f" "$GITHUB_WORKSPACE/out/"
          done < /tmp/found_pkgs.txt

      - name: Upload to release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.xbps
          tag_name: "pkg-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true

      - name: Push to packages branch
        if: success()
        shell: sh
        run: |
          set -eux
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan packages 2>/dev/null || git checkout packages
          git rm -rf . 2>/dev/null || true
          mkdir -p x86_64
          cp out/*.xbps x86_64/
          git add x86_64/
          git commit -m "packages: build #${{ github.run_number }}"
          git push -f origin packages
