name: build-package

on:
  workflow_dispatch:
    inputs:
      template_path:
        description: "template path"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    container: voidlinux/voidlinux:latest
    env:
      SSL_NO_VERIFY_PEER: "1"

    steps:
      - name: Fix mirror
        run: |
          for f in /usr/share/xbps.d/*.conf; do
            sed -i 's|https://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
            sed -i 's|http://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
          done
          cat /usr/share/xbps.d/*.conf

      - name: Install deps
        run: |
          xbps-install -Syu xbps
          xbps-install -Syu ca-certificates libstdc++

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Debug
        run: |
          echo "=== GITHUB_WORKSPACE: $GITHUB_WORKSPACE ==="
          echo "=== pwd: $(pwd) ==="
          echo "=== ls root ==="
          ls -la
          echo "=== xbps-src? ==="
          ls -la xbps-src 2>&1 || echo "NOT FOUND"
          echo "=== find xbps-src ==="
          find / -name "xbps-src" -type f 2>/dev/null | head -5

      - name: Configure ethereal mode
        run: |
          chmod +x "$GITHUB_WORKSPACE/xbps-src"
          printf "%s\n" \
            "XBPS_CHROOT_CMD=ethereal" \
            "XBPS_CHROOT_CMD=ethereal" \
            "XBPS_ALLOW_CHROOT_BREAKOUT=yes" \
            > etc/conf
          rm -rf masterdir
          ln -s / masterdir

      - name: Bootstrap
        run: |
          useradd -m -s /bin/sh builder 2>/dev/null || true
          chmod -R 777 "$GITHUB_WORKSPACE"
          su -s /bin/sh builder -c "export HOME=/github/home && cd $GITHUB_WORKSPACE && ./xbps-src binary-bootstrap"

      - name: Build
        run: |
          su -s /bin/sh builder -c "export HOME=/github/home && cd $GITHUB_WORKSPACE && ./xbps-src -A x86_64 pkg $(basename ${{ inputs.template_path }})"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: hostdir/binpkgs/x86_64/*.xbps
          tag_name: "pkg-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true

      - name: Push to packages branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan packages 2>/dev/null || git checkout packages
          git rm -rf . 2>/dev/null || true
          mkdir -p x86_64
          cp hostdir/binpkgs/x86_64/*.xbps x86_64/
          git add x86_64/
          git commit -m "packages: build #${{ github.run_number }}"
          git push -f origin packages   
