name: build-package

on:
  workflow_dispatch:
    inputs:
      template_path:
        description: "template path"
        required: true
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: voidlinux/voidlinux:latest
      options: --user root

    steps:
      - name: Fix mirror
        shell: sh
        run: |
          set -eux
          for f in /usr/share/xbps.d/*.conf; do
            sed -i 's|https://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
            sed -i 's|http://[^/]*repo[^/]*/|https://repo-fastly.voidlinux.org/|g' "$f"
          done
          echo "=== xbps mirrors ==="
          cat /usr/share/xbps.d/*.conf

      - name: Install Node dependencies in container
        shell: sh
        run: |
          set -eux
          xbps-install -Syu -R https://repo-fastly.voidlinux.org/current xbps
          xbps-install -Syu -R https://repo-fastly.voidlinux.org/current ca-certificates libstdc++ glibc git bash base-devel
          ldconfig
          ln -sf /usr/bin/bash /bin/sh

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure ethereal mode
        shell: sh
        run: |
          set -eux
          printf "%s\n" \
            "XBPS_CHROOT_CMD=ethereal" \
            "XBPS_ALLOW_CHROOT_BREAKOUT=yes" \
            > etc/conf
          rm -rf masterdir
          ln -s / masterdir

      - name: Bootstrap
        shell: bash
        run: |
          set -eux
          export HOME=/root
          cd "$GITHUB_WORKSPACE"
          ./xbps-src binary-bootstrap

      - name: Build
        shell: bash
        run: |
          set -eux
          export HOME=/root
          cd "$GITHUB_WORKSPACE"
          ./xbps-src -A x86_64 pkg "$(basename ${{ inputs.template_path }})"

      - name: Locate built packages
        shell: bash
        run: |
          set -eux
          PKG_DIR="$GITHUB_WORKSPACE/hostdir/binpkgs/x86_64"
          echo "=== contenuto di $PKG_DIR ==="
          ls -la "$PKG_DIR" || true
          shopt -s nullglob
          files=("$PKG_DIR"/*.xbps)
          if [ ${#files[@]} -eq 0 ]; then
            echo "ERRORE: nessun .xbps trovato in $PKG_DIR, la build non ha prodotto niente"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "${files[@]}" "$GITHUB_WORKSPACE/out/"
          echo "=== pacchetti trovati ==="
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.xbps
          tag_name: "pkg-${{ github.run_number }}"
          name: "Build #${{ github.run_number }}"
          draft: false
          prerelease: true

      - name: Push to packages branch
        if: success()
        shell: bash
        run: |
          set -eux
          git config --global --add safe.directory '*'
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          rm -rf /tmp/packages-push
          REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git clone --depth 1 --branch packages "$REPO_URL" /tmp/packages-push; then
            cd /tmp/packages-push
          else
            git clone --depth 1 "$REPO_URL" /tmp/packages-push
            cd /tmp/packages-push
            git checkout --orphan packages
            git rm -rf . 2>/dev/null || true
          fi

          mkdir -p x86_64
          cp "$GITHUB_WORKSPACE"/out/*.xbps x86_64/
          git add x86_64/
          git commit -m "packages: build #${{ github.run_number }}"
          git push -f origin packages
